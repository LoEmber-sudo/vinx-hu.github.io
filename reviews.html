<section id="reviews">
  <h2>Reviews</h2>
  <p id="reviews-summary" class="reviews-summary"></p>
  <div id="reviews-list" class="reviews-list">Loading reviews…</div>

  <h3>Leave a review</h3>
  <form id="review-form" class="review-form">
    <label>Your name
      <input type="text" name="name" maxlength="80" required>
    </label>

    <fieldset class="star-input">
      <legend>Rating</legend>
      <input type="radio" name="rating" id="star5" value="5" required><label for="star5" title="5 stars">★</label>
      <input type="radio" name="rating" id="star4" value="4"><label for="star4" title="4 stars">★</label>
      <input type="radio" name="rating" id="star3" value="3"><label for="star3" title="3 stars">★</label>
      <input type="radio" name="rating" id="star2" value="2"><label for="star2" title="2 stars">★</label>
      <input type="radio" name="rating" id="star1" value="1"><label for="star1" title="1 star">★</label>
    </fieldset>

    <label>Your review
      <textarea name="message" rows="4" maxlength="1000" required></textarea>
    </label>

    <label class="consent">
      <input type="checkbox" name="consent" required>
      I agree that my name and review may be stored and published on this website after approval.
    </label>

    <button type="submit">Submit review</button>
    <p id="review-status" role="status"></p>
  </form>
</section>

<style>
  #reviews { max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
  .reviews-summary { font-size: 1.1rem; margin-bottom: 1rem; }
  .stars { color: #e0a800; letter-spacing: 2px; }
  .review-item { border-bottom: 1px solid #ddd; padding: 1rem 0; }
  .review-item .meta { color: #777; font-size: .85rem; }
  .review-item p { margin: .4rem 0 0; white-space: pre-wrap; }
  .review-form { display: grid; gap: 1rem; }
  .review-form input[type=text], .review-form textarea {
    width: 100%; padding: .6rem; font: inherit; box-sizing: border-box;
  }
  .review-form .consent { font-size: .85rem; }
  .review-form button { padding: .7rem 1.2rem; font: inherit; cursor: pointer; }
  /* Star picker: stars are listed 5→1 and displayed reversed, so hover/checked fills leftwards */
  .star-input { border: 0; padding: 0; display: flex; flex-direction: row-reverse; justify-content: flex-end; }
  .star-input legend { float: left; margin-right: .75rem; padding: 0; }
  .star-input input { position: absolute; opacity: 0; }
  .star-input label { font-size: 2rem; color: #ccc; cursor: pointer; line-height: 1; }
  .star-input input:checked ~ label,
  .star-input label:hover,
  .star-input label:hover ~ label { color: #e0a800; }
  .star-input input:focus-visible + label { outline: 2px solid #4a90e2; }
</style>

<script>
  // ---- CONFIG: fill these in from Supabase > Project Settings > API ----
  const SUPABASE_URL = 'https://oiogzpohmshlnphxtarp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_dtiBBnFM-s4qyESbr1rkSQ_xLv6AZWr';

  const API = SUPABASE_URL + '/rest/v1/reviews';
  const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };

  const listEl = document.getElementById('reviews-list');
  const summaryEl = document.getElementById('reviews-summary');
  const statusEl = document.getElementById('review-status');

  const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);

  async function loadReviews() {
    try {
      const res = await fetch(
        API + '?select=name,rating,message,created_at&approved=eq.true&order=created_at.desc&limit=50',
        { headers }
      );
      if (!res.ok) throw new Error(res.status);
      const reviews = await res.json();

      listEl.textContent = '';
      if (!reviews.length) {
        listEl.textContent = 'No reviews yet. Be the first!';
        summaryEl.textContent = '';
        return;
      }

      const avg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
      summaryEl.innerHTML = '';
      const avgStars = document.createElement('span');
      avgStars.className = 'stars';
      avgStars.textContent = stars(Math.round(avg));
      summaryEl.append(avgStars, ' ' + avg.toFixed(1) + ' / 5 (' + reviews.length + ' reviews)');

      for (const r of reviews) {
        const item = document.createElement('div');
        item.className = 'review-item';

        const meta = document.createElement('div');
        meta.className = 'meta';
        const s = document.createElement('span');
        s.className = 'stars';
        s.textContent = stars(r.rating);
        meta.append(s, ' ' + r.name + ' · ' + new Date(r.created_at).toLocaleDateString());

        const text = document.createElement('p');
        text.textContent = r.message; // textContent => user text can never inject HTML

        item.append(meta, text);
        listEl.append(item);
      }
    } catch (e) {
      listEl.textContent = 'Reviews could not be loaded right now.';
    }
  }

  document.getElementById('review-form').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    statusEl.textContent = 'Sending…';

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { ...headers, Prefer: 'return=minimal' },
        body: JSON.stringify({
          name: data.get('name').trim(),
          rating: Number(data.get('rating')),
          message: data.get('message').trim()
        })
      });
      if (!res.ok) throw new Error(res.status);
      form.reset();
      statusEl.textContent = 'Thank you! Your review will appear once it has been approved.';
    } catch (err) {
      statusEl.textContent = 'Sorry, something went wrong. Please try again later.';
    }
  });

  loadReviews();
</script>
<!-- ===== END REVIEWS SECTION ===== -->
